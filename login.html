   <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login | Great Stand Educational Consult</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col min-h-screen justify-center items-center px-4">

    <!-- LOGIN/REGISTER CONTAINER -->
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl my-8">
        <div class="text-center mb-6">
            <a href="index.html" class="inline-block bg-amber-500 text-slate-950 font-black p-3 rounded-xl text-base mb-3">GS</a>
            <h1 class="text-xl font-bold text-white">Great Stand Portal</h1>
            <p class="text-xs text-slate-400 mt-1" id="formSubtitle">Sign in to access your student or tutor dashboard</p>
        </div>

        <!-- AUTH ERROR/SUCCESS MESSAGE -->
        <div id="authMessage" class="hidden mb-4 p-3 rounded-lg text-xs font-semibold"></div>

        <!-- LOGIN FORM -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>
                <input type="email" id="loginEmail" required placeholder="student@example.com" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500 transition">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500 transition">
            </div>
            <button type="submit" id="loginSubmitBtn" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold text-xs py-3 rounded-lg transition shadow-lg shadow-amber-500/20">
                Sign In
            </button>
        </form>

        <!-- REGISTER FORM (HIDDEN BY DEFAULT) -->
        <form id="registerForm" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Full Name</label>
                <input type="text" id="regName" required placeholder="John Doe" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500 transition">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>
                <input type="email" id="regEmail" required placeholder="student@example.com" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500 transition">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                <input type="password" id="regPassword" required placeholder="At least 6 characters" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500 transition">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Target Exam</label>
                <select id="regExam" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500 transition">
                    <option value="JAMB">JAMB UTME</option>
                    <option value="WAEC">WAEC SSCE</option>
                    <option value="NECO">NECO SSCE</option>
                    <option value="BOTH">BOTH JAMB & WAEC</option>
                </select>
            </div>
            <button type="submit" id="regSubmitBtn" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold text-xs py-3 rounded-lg transition shadow-lg shadow-amber-500/20">
                Create Student Account
            </button>
        </form>

        <!-- TOGGLE LOGIN/REGISTER -->
        <div class="mt-6 text-center">
            <button id="toggleAuthMode" class="text-xs text-slate-400 hover:text-amber-400 font-semibold transition">
                Don't have an account? Register here
            </button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBHnSGUALrnN-j8inER4MNcveQwJmyhLP4",
            authDomain: "great-stand-portal.firebaseapp.com",
            projectId: "great-stand-portal",
            storageBucket: "great-stand-portal.firebasestorage.app",
            messagingSenderId: "747296287485",
            appId: "1:747296287485:web:3289d724c48c197141ac94",
            measurementId: "G-JE18QY2Z2K"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isRegisterMode = false;

        // AUTH AUTO-REDIRECT ROUTER
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                const role = userDoc.exists() ? userDoc.data().role : "student";

                if (role === "super_admin" || role === "admin") {
                    window.location.href = "admin-portal.html";
                } else if (role === "tutor") {
                    window.location.href = "tutor-portal.html";
                } else {
                    window.location.href = "student-portal.html";
                }
            }
        });

        // TOGGLE FORMS
        document.getElementById('toggleAuthMode').addEventListener('click', () => {
            isRegisterMode = !isRegisterMode;
            document.getElementById('loginForm').classList.toggle('hidden', isRegisterMode);
            document.getElementById('registerForm').classList.toggle('hidden', !isRegisterMode);
            document.getElementById('formSubtitle').innerText = isRegisterMode ? "Create a new student account" : "Sign in to access your student or tutor dashboard";
            document.getElementById('toggleAuthMode').innerText = isRegisterMode ? "Already have an account? Sign In" : "Don't have an account? Register here";
        });

        // SHOW MESSAGES
        function showMsg(text, isError = true) {
            const el = document.getElementById('authMessage');
            el.className = `mb-4 p-3 rounded-lg text-xs font-semibold ${isError ? 'bg-red-500/20 text-red-300 border border-red-500/30' : 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'}`;
            el.innerText = text;
            el.classList.remove('hidden');
        }

        // HANDLE LOGIN
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            document.getElementById('loginSubmitBtn').innerText = "Authenticating...";

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (err) {
                showMsg(err.message.replace("Firebase: ", ""));
                document.getElementById('loginSubmitBtn').innerText = "Sign In";
            }
        });

        // HANDLE REGISTER
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const exam = document.getElementById('regExam').value;
            document.getElementById('regSubmitBtn').innerText = "Creating Account...";

            try {
                const cred = await createUserWithEmailAndPassword(auth, email, password);
                await setDoc(doc(db, "users", cred.user.uid), {
                    uid: cred.user.uid,
                    fullName: name,
                    email: email,
                    role: "student",
                    examType: exam,
                    status: "active",
                    createdAt: serverTimestamp()
                });
            } catch (err) {
                showMsg(err.message.replace("Firebase: ", ""));
                document.getElementById('regSubmitBtn').innerText = "Create Student Account";
            }
        });
    </script>
</body>
</html>
